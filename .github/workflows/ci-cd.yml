name: CI/CD Lambda

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destruir a stack em vez de aplicar"
        type: boolean
        default: false

concurrency:
  group: auth-lambda-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  NODE_VERSION: "20"
  TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Empacotar a função
        run: npm run package

      - name: Publicar artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda-zip
          path: lambda.zip
          retention-days: 7

      - name: Publicar cobertura
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'prod' || 'homolog' }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      url: ${{ steps.saida.outputs.api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Baixar artefato da função
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambda-zip

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar se as credenciais do lab ainda são válidas
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::Credenciais AWS expiradas. Atualize os secrets a partir de AWS Details -> AWS CLI no Learner Lab."
            exit 1
          fi

      - name: Verificar dependências entre stacks
        run: |
          faltando=""
          for p in \
            "/oficina/${TF_VAR_environment}/network/private_subnet_ids" \
            "/oficina/${TF_VAR_environment}/db/client_security_group_id" \
            "/oficina/${TF_VAR_environment}/db/database_url" \
            "/oficina/${TF_VAR_environment}/api/endpoint"
          do
            aws ssm get-parameter --name "$p" >/dev/null 2>&1 || faltando="$faltando\n  - $p"
          done
          if [ -n "$faltando" ]; then
            echo -e "::error::Parâmetros ausentes no SSM:$faltando\n\nAplique primeiro oficina-infra-k8s e depois oficina-infra-db."
            exit 1
          fi

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=auth-lambda/${TF_VAR_environment}/terraform.tfstate"

      - name: Terraform fmt & validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform apply
        if: ${{ !inputs.destroy }}
        working-directory: terraform
        env:
          TF_VAR_jwt_cliente_secret: ${{ secrets.JWT_CLIENTE_SECRET }}
        run: terraform apply -input=false -auto-approve

      - name: Terraform destroy
        if: ${{ inputs.destroy }}
        working-directory: terraform
        env:
          TF_VAR_jwt_cliente_secret: ${{ secrets.JWT_CLIENTE_SECRET }}
        run: terraform destroy -input=false -auto-approve

      - name: Coletar saídas
        id: saida
        if: ${{ !inputs.destroy }}
        working-directory: terraform
        run: |
          echo "api_url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"
          echo "auth_endpoint=$(terraform output -raw auth_endpoint)" >> "$GITHUB_OUTPUT"

      - name: Smoke test da autenticação
        if: ${{ !inputs.destroy }}
        run: |
          endpoint="${{ steps.saida.outputs.auth_endpoint }}"
          echo "Testando POST $endpoint"
          codigo=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$endpoint" \
            -H 'content-type: application/json' \
            -d '{"cpf":"00000000000"}' --max-time 30)
          echo "HTTP $codigo"; cat /tmp/resp.json
          if [ "$codigo" != "422" ]; then
            echo "::error::Esperado HTTP 422 para CPF inválido, recebido $codigo"
            exit 1
          fi

      - name: Resumo do deploy
        if: ${{ !inputs.destroy }}
        working-directory: terraform
        run: |
          {
            echo "## Autenticação por CPF publicada"
            echo ""
            echo "| Recurso | Valor |"
            echo "| --- | --- |"
            echo "| API Gateway | ${{ steps.saida.outputs.api_url }} |"
            echo "| Endpoint de auth | \`POST ${{ steps.saida.outputs.auth_endpoint }}\` |"
            echo "| Função | \`$(terraform output -raw lambda_function_name)\` |"
            echo ""
            echo "Smoke test: CPF inválido devolveu 422 como esperado."
          } >> "$GITHUB_STEP_SUMMARY"
